<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profe vs. Miranda</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Profe vs. Miranda</h1>
  <section id="seleccion-personaje" aria-labelledby="titulo-seleccion">
    <h2 id="titulo-seleccion">¿A quién quieres controlar?</h2>
    <div id="opciones-personaje">
      <button type="button" data-personaje="profe">Ser el profe</button>
      <button type="button" data-personaje="miranda">Ser Miranda</button>
    </div>
  </section>
  <p id="instrucciones" hidden></p>
  <canvas id="c" width="320" height="180" hidden></canvas>

  <div id="controles" hidden>
    <button id="izq" aria-label="Mover a la izquierda">◀</button>
    <button id="der" aria-label="Mover a la derecha">▶</button>
    <button id="saltar" aria-label="Saltar">SALTAR</button>
  </div>

  <h2>Ranking</h2>
  <ol id="ranking"></ol>
  <p id="estado-ranking" role="status" aria-live="polite"></p>

  <script src="{{ url_for('static', filename='juego.js') }}"></script>
</body>
</html>
